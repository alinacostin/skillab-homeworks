services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skillab_hw2_db
    environment:
      POSTGRES_USER: skillab
      POSTGRES_PASSWORD: skillab
      POSTGRES_DB: skillab_hw2
    ports:
      - "5434:5432"  
    volumes:
      - hw2_pgdata:/var/lib/postgresql/data

volumes:
  hw2_pgdata:
